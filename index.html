<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aero OS - نظام إدارة المطاعم الحقيقي</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0d1117; color: #f0f6fc; min-height: 100vh; display: flex; flex-direction: column; }
        
        .screen { display: none; flex: 1; padding: 15px; }
        .screen.active { display: flex; flex-direction: column; }

        /* شاشة تسجيل الدخول */
        .auth-container { justify-content: center; align-items: center; height: 100vh; background: #0d1117; }
        .auth-box { background: #161b22; border: 1px solid #30363d; padding: 30px; border-radius: 12px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        .auth-box h2 { color: #58a6ff; margin-bottom: 5px; font-size: 1.5rem; }
        .auth-box p { color: #8b949e; font-size: 0.85rem; margin-bottom: 20px; }
        .auth-input { width: 100%; padding: 12px; background: #0d1117; border: 1px solid #30363d; color: #fff; border-radius: 8px; margin-bottom: 15px; font-size: 1rem; }
        .auth-input:focus { border-color: #58a6ff; outline: none; }

        /* الهيدر والتنقل */
        .header { display: flex; justify-content: space-between; align-items: center; background: #161b22; padding: 12px 20px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #30363d; flex-wrap: wrap; gap: 10px; }
        .logo-area h1 { font-size: 1.2rem; color: #58a6ff; }
        .logo-area span { font-size: 0.8rem; color: #8b949e; }
        
        .nav-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; transition: 0.2s; }
        .btn:hover { background: #30363d; color: #fff; }
        .btn-primary { background: #1f6feb; color: #fff; border-color: #388bfd; }
        .btn-primary:hover { background: #388bfd; }
        .btn-danger { background: #da3633; color: #fff; border-color: #f85149; }
        .btn-success { background: #238636; color: #fff; border-color: #2ea043; }

        /* شريط الأقسام */
        .categories-bar { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 15px; }
        .cat-btn { background: #21262d; color: #8b949e; border: 1px solid #30363d; padding: 8px 16px; border-radius: 20px; white-space: nowrap; cursor: pointer; font-weight: bold; font-size: 0.9rem; }
        .cat-btn.active { background: #1f6feb; color: #fff; border-color: #388bfd; }

        /* التخطيط العام للمنيو والسلة */
        .main-container { display: grid; grid-template-columns: 1fr 380px; gap: 15px; flex-grow: 1; }
        @media (max-width: 900px) { .main-container { grid-template-columns: 1fr; } }

        .menu-section { display: flex; flex-direction: column; gap: 12px; }
        .order-type-selector { display: flex; gap: 10px; }
        .type-btn { flex: 1; padding: 10px; background: #21262d; border: 1px solid #30363d; color: #c9d1d9; border-radius: 8px; text-align: center; cursor: pointer; font-weight: bold; }
        .type-btn.active { background: #1f6feb; border-color: #388bfd; color: #fff; }

        /* شبكة الوجبات */
        .items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; overflow-y: auto; max-height: calc(100vh - 250px); padding-bottom: 10px; }
        .food-card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; cursor: pointer; transition: 0.2s; }
        .food-card:hover { border-color: #58a6ff; transform: translateY(-2px); }
        .food-img { width: 100%; height: 110px; object-fit: cover; background: #21262d; }
        .food-info { padding: 10px; display: flex; flex-direction: column; gap: 5px; flex-grow: 1; justify-content: space-between; }
        .food-title { font-size: 0.9rem; font-weight: bold; }
        .food-price { color: #3fb950; font-size: 0.85rem; font-weight: bold; }

        /* لوحة السلة */
        .cart-panel { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 15px; display: flex; flex-direction: column; height: fit-content; position: sticky; top: 10px; }
        .cart-title { font-size: 1.1rem; margin-bottom: 10px; border-bottom: 1px solid #30363d; padding-bottom: 8px; font-weight: bold; }
        
        .table-input-group { margin-bottom: 12px; display: flex; flex-direction: column; gap: 5px; }
        .table-input-group label { font-size: 0.85rem; color: #8b949e; font-weight: bold; }
        .table-input { width: 100%; padding: 10px; background: #0d1117; border: 1px solid #30363d; color: #fff; border-radius: 8px; font-size: 0.95rem; text-align: center; font-weight: bold; }
        .table-input:focus { border-color: #58a6ff; outline: none; }

        .cart-items { display: flex; flex-direction: column; gap: 8px; max-height: 180px; overflow-y: auto; margin-bottom: 12px; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; background: #21262d; padding: 8px; border-radius: 6px; font-size: 0.85rem; }
        .cart-total { font-size: 1.05rem; font-weight: bold; color: #3fb950; margin-bottom: 12px; border-top: 1px solid #30363d; padding-top: 8px; display: flex; justify-content: space-between; }
        .cart-actions { display: flex; flex-direction: column; gap: 8px; }

        /* شاشات النظام الحقيقية (المطبخ، الكاشير، الإدارة) */
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .page-header h2 { color: #58a6ff; }
        .kds-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
        .order-card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .order-card-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #30363d; padding-bottom: 8px; font-weight: bold; }
    </style>
</head>
<body>

    <!-- 1. شاشة تسجيل الدخول -->
    <div id="authScreen" class="screen auth-container active">
        <div class="auth-box">
            <h2>Aero OS</h2>
            <p>سجل مطعمك وابدأ تجربتك المجانية (15 يوماً)</p>
            <input type="text" id="restaurantName" class="auth-input" placeholder="اسم المطعم (مثلاً: مطعم دجلة)">
            <input type="password" class="auth-input" placeholder="كلمة المرور">
            <button class="btn btn-primary" style="width: 100%; padding: 12px; font-weight: bold;" onclick="loginRestaurant()">دخول للنظام</button>
        </div>
    </div>

    <!-- 2. شاشة المنيو الرئيسية (الزبون) -->
    <div id="mainScreen" class="screen">
        <div class="header">
            <div class="logo-area">
                <h1 id="displayRestName">Aero OS</h1>
                <span>النظام السحابي لإدارة المطاعم</span>
            </div>
            <div class="nav-buttons">
                <button class="btn btn-primary" onclick="showScreen('cashierScreen')">الكاشير والمبيعات</button>
                <button class="btn" onclick="showScreen('kdsScreen')">شاشة المطبخ (KDS)</button>
                <button class="btn btn-danger" onclick="logout()">خروج</button>
            </div>
        </div>

        <div class="main-container">
            <div class="menu-section">
                <div class="order-type-selector">
                    <div class="type-btn active" id="type-dine" onclick="setOrderType('صالة')">🍽️ صالة</div>
                    <div class="type-btn" id="type-takeaway" onclick="setOrderType('سفري')">🛍️ سفري</div>
                </div>

                <div class="categories-bar">
                    <button class="cat-btn active" onclick="filterMenu('all', this)">الكل</button>
                    <button class="cat-btn" onclick="filterMenu('eastern', this)">🕌 أكلات شرقية</button>
                    <button class="cat-btn" onclick="filterMenu('western', this)">🍔 أكلات غربية</button>
                    <button class="cat-btn" onclick="filterMenu('appetizers', this)">🍟 مقبلات</button>
                    <button class="cat-btn" onclick="filterMenu('drinks', this)">🥤 مشروبات</button>
                </div>

                <div class="items-grid" id="itemsGrid"></div>
            </div>

            <div class="cart-panel">
                <div class="cart-title">سلة الطلبات</div>
                
                <div class="table-input-group" id="tableGroup">
                    <label id="tableLabel">رقم الطاولة (إجباري):</label>
                    <input type="number" id="tableNumberInput" class="table-input" placeholder="مثال: 5" min="1">
                </div>
                
                <div class="cart-items" id="cartItems">
                    <div style="color: #8b949e; text-align: center; padding: 20px;">السلة فارغة</div>
                </div>

                <div class="cart-total">
                    <span>المجموع:</span>
                    <span id="cartTotal">0 د.ع</span>
                </div>

                <div class="cart-actions">
                    <button class="btn btn-primary" onclick="sendOrder()">إرسال الطلب للمطبخ</button>
                    <button class="btn" style="background: #9e6a03; color: #fff;" onclick="callWaiter()">🔔 طلب ويتر</button>
                    <button class="btn btn-success" onclick="requestBill()">💵 طلب الحساب</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 3. شاشة المطبخ الحقيقية (KDS) -->
    <div id="kdsScreen" class="screen">
        <div class="page-header">
            <h2>شاشة المطبخ الحية (الطلبات الواردة)</h2>
            <button class="btn" onclick="showScreen('mainScreen')">العودة للمنيو</button>
        </div>
        <div class="kds-grid" id="kdsOrdersGrid">
            <div style="color: #8b949e; grid-column: 1/-1; text-align: center; padding: 40px;">لا توجد طلبات جديدة حالياً</div>
        </div>
    </div>

    <!-- 4. شاشة الكاشير الحقيقية -->
    <div id="cashierScreen" class="screen">
        <div class="page-header">
            <h2>لوحة الكاشير والمبيعات اليومية</h2>
            <button class="btn" onclick="showScreen('mainScreen')">العودة للمنيو</button>
        </div>
        <div style="background: #161b22; border: 1px solid #30363d; padding: 20px; border-radius: 12px; margin-bottom: 20px;">
            <h3 style="color: #3fb950; margin-bottom: 5px;" id="totalRevenue">0 د.ع</h3>
            <p style="color: #8b949e; font-size: 0.9rem;">إجمالي مبيعات اليوم</p>
        </div>
        <div class="kds-grid" id="cashierOrdersGrid"></div>
    </div>

    <script>
        const menuItems = [
            { id: 1, name: 'تكة مشوي عراقي', category: 'eastern', price: 12000, img: 'https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=400' },
            { id: 2, name: 'كباب لحم شهي', category: 'eastern', price: 9000, img: 'https://images.unsplash.com/photo-1529193591184-b1d58069ecdd?w=400' },
            { id: 3, name: 'قوزي لحم عراقي', category: 'eastern', price: 15000, img: 'https://images.unsplash.com/photo-1544025162-d76694265947?w=400' },
            { id: 4, name: 'برجر لحم ديلاكس', category: 'western', price: 5000, img: 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=400' },
            { id: 5, name: 'برجر دجاج مقرمش', category: 'western', price: 4500, img: 'https://images.unsplash.com/photo-1625813506062-0aeb1d7a094b?w=400' },
            { id: 6, name: 'بيتزا شيكاغو وسط', category: 'western', price: 10000, img: 'https://images.unsplash.com/photo-1513104890138-7c749659a591?w=400' },
            { id: 7, name: 'بطاطس مقلية بالجبن', category: 'appetizers', price: 2500, img: 'https://images.unsplash.com/photo-1576107232684-1279f390859f?w=400' },
            { id: 8, name: 'حمص باللحم', category: 'appetizers', price: 4000, img: 'https://images.unsplash.com/photo-1541529086526-db283c563270?w=400' },
            { id: 9, name: 'متبل باذنجان', category: 'appetizers', price: 3000, img: 'https://images.unsplash.com/photo-1577805947697-89e18249d767?w=400' },
            { id: 10, name: 'بيبسي / كوكاكولا', category: 'drinks', price: 1000, img: 'https://images.unsplash.com/photo-1622483767028-3f66f32aef97?w=400' },
            { id: 11, name: 'عصير برتقال طبيعي', category: 'drinks', price: 3000, img: 'https://images.unsplash.com/photo-1613478223719-2ab802602423?w=400' },
            { id: 12, name: 'مياه معدنية', category: 'drinks', price: 500, img: 'https://images.unsplash.com/photo-1548839140-29a749e1cf4d?w=400' }
        ];

        let cart = [];
        let orderType = 'صالة';
        let activeOrders = JSON.parse(localStorage.getItem('aero_orders')) || [];

        window.onload = function() {
            const savedRest = localStorage.getItem('aero_restaurant');
            if(savedRest) {
                document.getElementById('displayRestName').innerText = savedRest;
                showScreen('mainScreen');
            }
        };

        function loginRestaurant() {
            const nameInput = document.getElementById('restaurantName').value.trim();
            if(!nameInput) {
                alert('الرجاء إدخال اسم المطعم للبدء.');
                return;
            }
            localStorage.setItem('aero_restaurant', nameInput);
            document.getElementById('displayRestName').innerText = nameInput;
            showScreen('mainScreen');
            renderMenu(menuItems);
        }

        function logout() {
            localStorage.removeItem('aero_restaurant');
            showScreen('authScreen');
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            
            if(screenId === 'mainScreen') {
                renderMenu(menuItems);
            } else if(screenId === 'kdsScreen') {
                renderKDSOrders();
            } else if(screenId === 'cashierScreen') {
                renderCashierOrders();
            }
        }

        function setOrderType(type) {
            orderType = type;
            document.getElementById('type-dine').classList.toggle('active', type === 'صالة');
            document.getElementById('type-takeaway').classList.toggle('active', type === 'سفري');
            
            const tableLabel = document.getElementById('tableLabel');
            const tableInput = document.getElementById('tableNumberInput');

            if(type === 'سفري') {
                tableLabel.innerText = 'رقم الزبون / الهاتف (اختياري):';
                tableInput.placeholder = 'مثال: سفري';
            } else {
                tableLabel.innerText = 'رقم الطاولة (إجباري):';
                tableInput.placeholder = 'مثال: 5';
            }
        }

        function renderMenu(items) {
            const grid = document.getElementById('itemsGrid');
            grid.innerHTML = items.map(item => `
                <div class="food-card" onclick="addToCart(${item.id})">
                    <img src="${item.img}" class="food-img" alt="${item.name}">
                    <div class="food-info">
                        <div class="food-title">${item.name}</div>
                        <div class="food-price">${item.price.toLocaleString()} د.ع</div>
                    </div>
                </div>
            `).join('');
        }

        function filterMenu(category, btn) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            if(category === 'all') {
                renderMenu(menuItems);
            } else {
                renderMenu(menuItems.filter(i => i.category === category));
            }
        }

        function addToCart(id) {
            const item = menuItems.find(i => i.id === id);
            const existing = cart.find(i => i.id === id);
            if(existing) {
                existing.qty++;
            } else {
                cart.push({ ...item, qty: 1 });
            }
            updateCart();
        }

        function updateCart() {
            const container = document.getElementById('cartItems');
            if(cart.length === 0) {
                container.innerHTML = '<div style="color: #8b949e; text-align: center; padding: 20px;">السلة فارغة</div>';
                document.getElementById('cartTotal').innerText = '0 د.ع';
                return;
            }

            container.innerHTML = cart.map((item, index) => `
                <div class="cart-item">
                    <span>${item.name} (${item.qty})</span>
                    <span>${(item.price * item.qty).toLocaleString()} د.ع</span>
                    <button class="btn btn-danger" style="padding: 2px 6px; font-size: 0.75rem;" onclick="removeFromCart(${index})">✕</button>
                </div>
            `).join('');

            const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            document.getElementById('cartTotal').innerText = total.toLocaleString() + ' د.ع';
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCart();
        }

        function sendOrder() {
            if(cart.length === 0) {
                alert('السلة فارغة! الرجاء اختيار وجبات أولاً.');
                return;
            }
            
            const tableVal = document.getElementById('tableNumberInput').value.trim();
            if(orderType === 'صالة' && !tableVal) {
                alert('⚠️ عذراً، يجب إدخال رقم الطاولة لتمكين إرسال الطلب!');
                document.getElementById('tableNumberInput').focus();
                return;
            }

            const newOrder = {
                id: Date.now().toString().slice(-4),
                type: orderType,
                table: tableVal || 'سفري',
                items: [...cart],
                total: cart.reduce((sum, item) => sum + (item.price * item.qty), 0),
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                status: 'قيد التحضير'
            };

            activeOrders.push(newOrder);
            localStorage.setItem('aero_orders', JSON.stringify(activeOrders));

            alert(`✅ تم إرسال الطلب رقم #${newOrder.id} للمطبخ بنجاح!`);
            cart = [];
            document.getElementById('tableNumberInput').value = '';
            updateCart();
        }

        function renderKDSOrders() {
            const grid = document.getElementById('kdsOrdersGrid');
            if(activeOrders.length === 0) {
                grid.innerHTML = '<div style="color: #8b949e; grid-column: 1/-1; text-align: center; padding: 40px;">لا توجد طلبات جديدة حالياً</div>';
                return;
            }

            grid.innerHTML = activeOrders.map((ord, index) => `
                <div class="order-card">
                    <div class="order-card-header">
                        <span>طلب #${ord.id} (${ord.type})</span>
                        <span style="color: #3fb950;">الطاولة: ${ord.table}</span>
                    </div>
                    <div style="font-size: 0.85rem; color: #8b949e;">الوقت: ${ord.time}</div>
                    <div style="display: flex; flex-direction: column; gap: 4px; margin: 5px 0;">
                        ${ord.items.map(i => `<div>• ${i.name} (${i.qty})</div>`).join('')}
                    </div>
                    <div style="font-weight: bold; color: #58a6ff;">المجموع: ${ord.total.toLocaleString()} د.ع</div>
                    <button class="btn btn-success" onclick="completeOrder(${index})">إنجاز الطلب وتسليمه</button>
                </div>
            `).join('');
        }

        function completeOrder(index) {
            activeOrders.splice(index, 1);
            localStorage.setItem('aero_orders', JSON.stringify(activeOrders));
            renderKDSOrders();
        }

        function renderCashierOrders() {
            const grid = document.getElementById('cashierOrdersGrid');
            const totalRev = activeOrders.reduce((sum, ord) => sum + ord.total, 0);
            document.getElementById('totalRevenue').innerText = totalRev.toLocaleString() + ' د.ع';

            if(activeOrders.length === 0) {
                grid.innerHTML = '<div style="color: #8b949e; grid-column: 1/-1; text-align: center; padding: 40px;">لا توجد مبيعات نشطة حالياً</div>';
                return;
            }

            grid.innerHTML = activeOrders.map(ord => `
                <div class="order-card">
                    <div class="order-card-header">
                        <span>طلب #${ord.id} (${ord.type})</span>
                        <span>الطاولة: ${ord.table}</span>
                    </div>
                    <div style="font-weight: bold; color: #3fb950;">المبلغ: ${ord.total.toLocaleString()} د.ع</div>
                </div>
            `).join('');
        }

        function callWaiter() {
            const tableVal = document.getElementById('tableNumberInput').value.trim();
            if(orderType === 'صالة' && !tableVal) {
                alert('⚠️ يرجى كتابة رقم الطاولة لكي يتمكن الويتر من معرفة مكانك!');
                document.getElementById('tableNumberInput').focus();
                return;
            }
            alert(`🔔 تم إرسال نداء الويتر للطاولة رقم: ${tableVal || 'سفري'}`);
        }

        function requestBill() {
            const tableVal = document.getElementById('tableNumberInput').value.trim();
            if(orderType === 'صالة' && !tableVal) {
                alert('⚠️ يرجى كتابة رقم الطاولة لطلب الحساب!');
                document.getElementById('tableNumberInput').focus();
                return;
            }
            alert(`💵 تم إرسال طلب الحساب للكاشير للطاولة رقم: ${tableVal || 'سفري'}`);
        }
    </script>
</body>
</html>
