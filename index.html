<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الكاشير والطلبات - المطعم</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Tahoma, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: #2c3e50;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            flex-direction: column;
        }
        @media(min-width: 768px) {
            .main-container {
                flex-direction: row;
            }
        }
        .menu-section {
            flex: 2;
            padding: 15px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 15px;
            align-content: start;
        }
        .item-card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: center;
            cursor: pointer;
        }
        .item-card h3 {
            font-size: 16px;
            margin-bottom: 8px;
            color: #2c3e50;
        }
        .item-card p {
            color: #e74c3c;
            font-weight: bold;
        }
        .cart-section {
            flex: 1;
            background: white;
            border-top: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            padding: 15px;
        }
        .cart-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            border-bottom: 2px solid #f4f6f9;
            padding-bottom: 8px;
        }
        .cart-items {
            flex: 1;
            overflow-y: auto;
            max-height: 150px;
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }
        .cart-total {
            font-size: 18px;
            font-weight: bold;
            text-align: left;
            margin: 10px 0;
            color: #27ae60;
        }
        .checkout-btn {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>

    <header>نظام الكاشير والطلبات - المطعم</header>

    <div class="main-container">
        <div class="menu-section" id="menu">
            <div class="item-card" onclick="addToCart('برجر لحم', 5000)">
                <h3>برجر لحم</h3>
                <p>5,000 د.ع</p>
            </div>
            <div class="item-card" onclick="addToCart('برجر دجاج', 4500)">
                <h3>برجر دجاج</h3>
                <p>4,500 د.ع</p>
            </div>
            <div class="item-card" onclick="addToCart('بيتزا شيكاغو', 10000)">
                <h3>بيتزا شيكاغو</h3>
                <p>10,000 د.ع</p>
            </div>
            <div class="item-card" onclick="addToCart('بطاطس مقلية', 2000)">
                <h3>بطاطس مقلية</h3>
                <p>2,000 د.ع</p>
            </div>
            <div class="item-card" onclick="addToCart('بيبسي', 1000)">
                <h3>بيبسي</h3>
                <p>1,000 د.ع</p>
            </div>
        </div>

        <div class="cart-section">
            <div class="cart-title">سلة الطلبات</div>
            <div class="cart-items" id="cartItems">
                <p style="color: #888; text-align: center;">السلة فارغة</p>
            </div>
            <div class="cart-total" id="cartTotal">المجموع: 0 د.ع</div>
            <button class="checkout-btn" onclick="checkout()">إتمام الطلب</button>
        </div>
    </div>

    <script>
        let cart = [];

        function addToCart(name, price) {
            let existingItem = cart.find(item => item.name === name);
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ name: name, price: price, quantity: 1 });
            }
            updateCartUI();
        }

        function updateCartUI() {
            const cartItemsContainer = document.getElementById('cartItems');
            const cartTotalContainer = document.getElementById('cartTotal');

            if (cart.length === 0) {
                cartItemsContainer.innerHTML = '<p style="color: #888; text-align: center;">السلة فارغة</p>';
                cartTotalContainer.innerText = 'المجموع: 0 د.ع';
                return;
            }

            let html = '';
            let total = 0;

            cart.forEach((item) => {
                let itemTotal = item.price * item.quantity;
                total += itemTotal;
                html += `
                    <div class="cart-item">
                        <span>${item.name} (${item.quantity})</span>
                        <span>${itemTotal.toLocaleString()} د.ع</span>
                    </div>
                `;
            });

            cartItemsContainer.innerHTML = html;
            cartTotalContainer.innerText = `المجموع: ${total.toLocaleString()} د.ع`;
        }

        function checkout() {
            if (cart.length === 0) {
                alert('السلة فارغة بالفعل!');
                return;
            }
            alert('تم إتمام الطلب بنجاح وتوجيهه إلى المطبخ!');
            cart = [];
            updateCartUI();
        }
    </script>
</body>
</html>
